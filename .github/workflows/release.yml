name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches VERSION in the script
        run: |
          tag="${GITHUB_REF_NAME#v}"
          script="$(awk -F'"' '/^VERSION=/{print $2; exit}' bin/clean-node-modules)"
          if [ "$tag" != "$script" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION=$script in bin/clean-node-modules" >&2
            exit 1
          fi

      - name: Test
        run: make test

      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck bin/clean-node-modules test/run-tests.sh install.sh

      - name: Build release artifacts
        run: make dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/clean-node-modules \
            dist/clean-node-modules-*.tar.gz \
            dist/SHA256SUMS
